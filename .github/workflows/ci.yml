name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # Pin the LTS matching the dev machine; ubuntu-latest moves to 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full-version tags only (no floating major tag)
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test (no paid API calls)
        run: uv run pytest
